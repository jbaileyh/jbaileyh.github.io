# Netlify builds this site from the Git repo using the official Quarto plugin.
# The plugin installs Quarto, then runs `quarto render` during the build step.
# Code (Python/R) is NOT run on Netlify: results come from _freeze/, which you
# create by running `quarto render` locally and committing it.

[build]
  publish = "_site"
  # The plugin does the rendering. This placeholder overrides any old
  # build command saved in the Netlify UI (e.g. the previous Hugo one).
  command = "echo 'Quarto plugin renders the site'"

[build.environment]
  QUARTO_VERSION = "v1.11.9"   # keep in step with the version you use locally

[[plugins]]
  package = "@quarto/netlify-plugin-quarto"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/site_libs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
