project:
  type: website
  output-dir: _site
  resources:
    - assets/fonts/
    - assets/svg/
    - assets/images/
  preview:
    port: 4321

# Code is executed on YOUR machine, and the results are stored in _freeze/ (commit it!).
# CI then just stitches the pages together - no Python or R needed on GitHub.
execute:
  freeze: auto

website:
  title: "StellarGrok"
  description: "Personal notes on Bits, Bytes and Bots"
  site-url: https://your-site.netlify.app      # <- change after first deploy
  favicon: assets/svg/decor/sparkle.svg
  open-graph:
    image: assets/images/og-default-forest.png
  twitter-card:
    image: assets/images/og-default-forest.png
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay

  navbar:
    title: "StellarGrok"
    left:
      - text: Blog
        menu:
          - text: "All posts"
            href: blog.qmd
          - text: "---"
          - text: "AI"
            href: sections/ai.qmd
          - text: "Data"
            href: sections/data.qmd
          - text: "Art"
            href: sections/art.qmd
          - text: "Leadership"
            href: sections/leadership.qmd
          - text: "Other"
            href: sections/other.qmd
      - text: About
        href: about.qmd

  page-footer:
    background: dark
    left: "© 2026 Joseph Bailey"
    right:
      - icon: github
        href: https://github.com/jbaileyh
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jbaileyh/
        aria-label: LinkedIn

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
    css: assets/fonts.css
    toc: true
    toc-location: right
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    code-link: true
    highlight-style: github
    fig-responsive: true
    fig-dpi: 144
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preload" href="/assets/fonts/BricolageGrotesque-Variable.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="/assets/fonts/HankenGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
